<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libsumo in the browser</title>
<style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    button { font: inherit; padding: 4px 12px; }
    #status { font-variant-numeric: tabular-nums; opacity: 0.8; }
    canvas { width: 100%; max-width: 900px; border: 1px solid currentColor; background: #11151c; }
</style>
</head>
<body>
<h1>libsumo in the browser</h1>
<div id="controls">
    <button id="play" disabled>play</button>
    <button id="stepButton" disabled>step</button>
    <button id="reload" disabled>restart</button>
    <span id="status">loading libsumo.wasm ...</span>
</div>
<canvas id="canvas" width="800" height="600"></canvas>

<script src="libsumo.js"></script>
<script>
'use strict';

const SCENARIO = ['example.sumocfg', 'net.net.xml', 'routes.rou.xml'];
const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d');
const status = document.getElementById('status');
const playButton = document.getElementById('play');
const stepButton = document.getElementById('stepButton');
const reloadButton = document.getElementById('reload');

let libsumo = null;
let networkPath = null;   // the static network geometry, built once per load
let networkMaxSpeed = 1;
let transform = null;
let running = false;

function fitToCanvas(boundary) {
    const [min, max] = boundary;
    const margin = 10;
    const scale = Math.min((canvas.width - 2 * margin) / (max.x - min.x),
                           (canvas.height - 2 * margin) / (max.y - min.y));
    // center the network in the canvas; SUMO has y pointing up, the canvas down
    const offsetX = (canvas.width - (max.x - min.x) * scale) / 2;
    const offsetY = (canvas.height - (max.y - min.y) * scale) / 2;
    return (x, y) => [offsetX + (x - min.x) * scale, canvas.height - offsetY - (y - min.y) * scale];
}

function loadScenario() {
    setRunning(false);
    libsumo.Simulation.load(['-c', '/scenario/example.sumocfg', '--no-step-log', '--xml-validation', 'never']);
    transform = fitToCanvas(libsumo.Simulation.getNetBoundary());

    // the network never moves, so it is transformed once into a reusable path
    networkPath = new Path2D();
    networkMaxSpeed = 1;
    for (const laneID of libsumo.Lane.getIDList()) {
        networkMaxSpeed = Math.max(networkMaxSpeed, libsumo.Lane.getMaxSpeed(laneID));
        libsumo.Lane.getShape(laneID).forEach((point, index) => {
            const [x, y] = transform(point.x, point.y);
            index === 0 ? networkPath.moveTo(x, y) : networkPath.lineTo(x, y);
        });
    }
    draw();
}

function draw() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = '#5a6473';
    context.lineWidth = 3;
    context.stroke(networkPath);

    const vehIDs = libsumo.Vehicle.getIDList();
    for (const vehID of vehIDs) {
        const position = libsumo.Vehicle.getPosition(vehID);
        const [x, y] = transform(position.x, position.y);
        // SUMO angles are given in degrees, clockwise from north
        context.save();
        context.translate(x, y);
        context.rotate(libsumo.Vehicle.getAngle(vehID) * Math.PI / 180);
        // green when driving freely, red when standing
        const green = Math.round(220 * Math.min(libsumo.Vehicle.getSpeed(vehID) / networkMaxSpeed, 1));
        context.fillStyle = `rgb(230, ${green + 30}, 60)`;
        context.fillRect(-2.5, -5, 5, 10);
        context.restore();
    }

    const expected = libsumo.Simulation.getMinExpectedNumber();
    status.textContent = `t = ${libsumo.Simulation.getTime().toFixed(0)} s, ` +
        `${vehIDs.length} vehicles running, ${expected} expected`;
    return expected;
}

function setRunning(value) {
    running = value;
    playButton.textContent = value ? 'pause' : 'play';
}

function step() {
    libsumo.Simulation.step(0);
    if (draw() === 0) {
        setRunning(false);
        status.textContent = `finished at t = ${libsumo.Simulation.getTime().toFixed(0)} s`;
    }
}

function animate() {
    if (running) {
        step();
        requestAnimationFrame(animate);
    }
}

playButton.addEventListener('click', () => {
    setRunning(!running);
    animate();
});

stepButton.addEventListener('click', () => {
    setRunning(false);
    step();
});

reloadButton.addEventListener('click', loadScenario);

createLibsumo().then(async (module) => {
    libsumo = module;
    const files = await Promise.all(SCENARIO.map(async (name) => {
        const response = await fetch('example/' + name);
        if (!response.ok) {
            throw new Error(`could not fetch example/${name}: ${response.status}`);
        }
        return [name, new Uint8Array(await response.arrayBuffer())];
    }));
    libsumo.FS.mkdir('/scenario');
    for (const [name, content] of files) {
        libsumo.FS.writeFile('/scenario/' + name, content);
    }
    loadScenario();
    playButton.disabled = stepButton.disabled = reloadButton.disabled = false;
}).catch((error) => {
    status.textContent = 'failed: ' + error.message;
    console.error(error);
});
</script>
</body>
</html>
