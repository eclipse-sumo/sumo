[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "libsumo"
version = "0.0.0"
dependencies = ["traci>=0.0.0", "sumo-data>=0.0.0"]
authors = [{name = "DLR and contributors", email = "sumo@dlr.de"}]
license = "EPL-2.0 OR GPL-2.0-or-later"
description = "The python version of the libsumo API to communicate with the traffic simulation Eclipse SUMO"
keywords = ["traffic", "simulation", "traci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python",
]

[project.readme]
content-type = "text/markdown"
text = '''
libsumo runs Eclipse SUMO inside a Python process. It exposes the TraCI domains for simulation steps, vehicles, people, routes, and traffic signals. Existing TraCI scripts can import `libsumo as traci` and use the same simulation controls.

Install with `pip install libsumo`. Start the simulation with `libsumo.start(["sumo", "-c", "scenario.sumocfg"])`, advance it with `libsumo.simulationStep()`, and finish with `libsumo.close()`.

[libsumo guide](https://sumo.dlr.de/docs/Libsumo.html) · [TraCI API](https://sumo.dlr.de/docs/TraCI.html)
'''

[project.urls]
Homepage = "https://sumo.dlr.de/"
Documentation = "https://sumo.dlr.de/docs/Libsumo.html"
Repository = "https://github.com/eclipse-sumo/sumo"
Issues = "https://github.com/eclipse-sumo/sumo/issues"
Changelog = "https://sumo.dlr.de/docs/ChangeLog"
Download = "https://sumo.dlr.de/download"

[tool.scikit-build]
build-dir = "_skbuild"
build.targets = ["libsumo"]
install.components = ["tools_libsumo"]
wheel.packages = ["tools/libsumo"]

[tool.scikit-build.cmake.define]
CMAKE_CXX_SCAN_FOR_MODULES = "OFF"
ENABLE_FFMPEG = "OFF"
ENABLE_OSG = "OFF"

[tool.cibuildwheel]
before-all = "build_config/install_dependencies.sh"
build = ["cp*manylinux_x86_64", "cp*manylinux_aarch64", "cp*-win_amd64", "cp*-macosx_arm64"]

[tool.cibuildwheel.windows]
before-all = ""
# delvewheel would pull in all dlls again, so do nothing here
repair-wheel-command = ""

[[tool.cibuildwheel.overrides]]
select = "*-macosx_*"
# delocate would copy all dylibs again, they are shared via sumo-data, see tools/build_config/relocate.py
repair-wheel-command = ""
