name: Generate build and test matrix

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
    outputs:
      build_matrix:
        value: ${{ jobs.generate-matrix.outputs.build_matrix }}
      test_matrix:
        value: ${{ jobs.generate-matrix.outputs.test_matrix }}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      test_matrix: ${{ steps.gen.outputs.test_matrix }}
    steps:
      - id: gen
        env:
          INPUT_OS: ${{ inputs.os }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          import json, os

          osl = (os.environ.get('INPUT_OS') or 'macos-15,macos-26,ubuntu-latest,ubuntu-24.04-arm,windows-latest').split(",")
          manylinux = ["default", "manylinux2014", "manylinux_2_28"]
          python_versions = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
          # pull requests only test the earliest, the reference and the latest Python, one macOS and no manylinux2014
          pr = os.environ.get('EVENT_NAME') == 'pull_request'
          if pr:
              python_versions = ["3.10", "3.12", "3.15"]
              manylinux = ["default", "manylinux_2_28"]

          include_build = []
          include_test = []
          for osys in osl:
              for ml in manylinux:
                  if (ml == "default") == osys.startswith("ubuntu"):
                      continue
                  if osys != "macos-26" or "macos-15" not in osl:
                      include_build.append({"os": osys, "manylinux": ml})
                  if pr and osys == "macos-15" and "macos-26" in osl:
                      continue
                  for py in python_versions:
                      include_test.append({"os": osys, "manylinux": ml, "python_version": py, "shard": "python"})
                      if py == "3.12":
                          # the binaries do not depend on the Python version, so they are tested once, in a parallel job
                          include_test.append({"os": osys, "manylinux": ml, "python_version": py, "shard": "binaries"})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f"build_matrix={json.dumps({'include': include_build})}", file=f)
              print(f"test_matrix={json.dumps({'include': include_test})}", file=f)
