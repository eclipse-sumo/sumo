name: macos

on:
  push:            # run on push events
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
    branches:
      - '**'
    tags:
      - '*'
  pull_request:    # run on pull requests
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
  schedule:
    - cron:  '5 2 * * 1-6'
    # weekly clean build (no cache restore)
    - cron:  '5 2 * * 0'

concurrency:
  # a push to a branch with a pull request is cancelled by the pull request run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_COMPILERTYPE: clang

    steps:
    - name: Cloning SUMO
      uses: actions/checkout@v7
      with:
        path: sumo
        fetch-depth: 0
        filter: tree:0
        # to work around actions/checkout#1467
        ref: ${{ github.ref }}

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        restore: ${{ github.event.schedule != '5 2 * * 0' }}
        key: ${{ matrix.os }}
        save: ${{ github.ref == 'refs/heads/main' }}
        evict-old-files: job

    - name: Configuring Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Installing dependencies
      run: sumo/build_config/install_dependencies.sh

    - name: Building SUMO
      run: |
        cmake -B sumo/cmake-build sumo
        cmake --build sumo/cmake-build -j4

    - name: Building Traas
      run: cmake --build sumo/cmake-build --target traas

    - name: Installing SUMO
      run: sudo cmake --install sumo/cmake-build

    - name: Building Examples and Tests
      run: |
        export DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:$DYLD_FALLBACK_LIBRARY_PATH
        cd sumo/cmake-build
        make CTEST_OUTPUT_ON_FAILURE=1 examples test

    - name: Uploading artifacts (SUMO examples with outputs)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-examples
        path: sumo/docs/examples

    - name: Running texttest
      run: |
        export DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:$DYLD_FALLBACK_LIBRARY_PATH
        python3 -m venv testenv
        source testenv/bin/activate
        python -m pip install texttest -r sumo/tools/req_ci.txt
        sumo/tests/runTests.sh -b ci -v ci -finverse $PWD/sumo/tests/filter_files/macos_failures.txt

    - name: Uploading artifacts (SUMO binaries and FMU)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-binaries
        path: sumo/bin

    - name: Creating macOS installer pkg
      run: |
        python3 -m venv dmgenv
        dmgenv/bin/python3 -m pip install dmgbuild delocate
        dmgenv/bin/python3 sumo/tools/build_config/buildMacOSInstaller.py --create-framework-dir --build-dir sumo/cmake-build
        dmgenv/bin/python3 sumo/tools/build_config/buildMacOSInstaller.py --create-framework-pkg

    - name: Uploading macOS installer pkg
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-installer-unsigned
        path: framework-pkg/*.pkg

    - name: Compressing test results
      if: failure()
      run: 7z a -bso0 -bsp0 texttesttmp-${{ matrix.os }}.zip ~/.texttest/tmp

    - name: Uploading test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        path: texttesttmp-${{ matrix.os }}.zip
        archive: false
        if-no-files-found: warn
