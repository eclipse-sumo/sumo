name: windows-wheels

on:
  push:            # run on push events
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
      - 'src/gui*/**'
      - 'src/netedit/**'
      - 'tests/netedit/**'
    branches:
      - '**'
    tags:
      - '*'
  pull_request:    # run on pull requests, but only if something relevant for the wheels changed
    paths:
      - 'CMakeLists.txt'
      - 'build_config/**'
      - 'pysrc/**'
      - 'src/libsumo/**'
      - 'src/libtraci/**'
      - 'tools/traci/**'
      - 'tools/sumolib/**'
      - '.github/workflows/*wheels.yml'
      - '.github/workflows/generate-matrix.yml'
  workflow_dispatch:
  schedule:
    - cron:  '5 1 * * *'

concurrency:
  # a push to a branch with a pull request is cancelled by the pull request run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  call-cibuildwheel:
    uses: ./.github/workflows/cibuildwheel.yml
    with:
      os: "windows-latest"

  check-dependencies:
    needs: [call-cibuildwheel]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10", "3.12", "3.15"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]') }}

    steps:
    - name: Downloading Wheels artifact
      uses: actions/download-artifact@v8
      with:
        path: python-wheels
        merge-multiple: true

    - name: Configuring Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}

    - name: Installing libsumo
      run: |
        python -m pip install --no-index -f python-wheels libsumo
        python -c "import libsumo; print(libsumo.__file__)"

    - name: Running dependency checker
      if: github.event_name == 'schedule'
      run: |
          Invoke-WebRequest -Uri https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release_.without.peview.exe.zip -OutFile Dependencies.zip
          7z x -oDependencies Dependencies.zip
          $env:PATH += ";" + $env:SUMO_HOME + "\bin"
          python -c "import libsumo, subprocess; subprocess.call(['Dependencies\\Dependencies.exe', '-modules', '-depth', '2', libsumo.__file__.replace('__init__.py', '_libsumo.pyd')])"
