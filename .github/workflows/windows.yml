name: windows

on:
  push:            # run on push events
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
    branches:
      - '**'
    tags:
      - '*'
  pull_request:    # run on pull requests
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron:  '25 1 * * 1-6'
    # weekly clean build (no cache restore)
    - cron:  '25 1 * * 0'

concurrency:
  # a push to a branch with a pull request is cancelled by the pull request run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type: [plain, extra]
    env:
      CC: cl
      CXX: cl

    steps:
    - name: Cloning SUMO
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: tree:0
        # to work around actions/checkout#1467
        ref: ${{ github.ref }}

    - name: Fetching SUMO Libraries
      # this also sets $SUMO_LIBRARIES
      uses: ./.github/actions/fetch-sumo-libraries

    - name: Setup fail-fast PowerShell
      run: |
        if (-not (Test-Path $PROFILE.CurrentUserAllHosts)) {
          New-Item -ItemType File -Path $PROFILE.CurrentUserAllHosts -Force | Out-Null
        }
        Add-Content -Path $PROFILE.CurrentUserAllHosts -Value '$ErrorActionPreference = "Stop"'

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        restore: ${{ github.event.schedule != '25 1 * * 0' }}
        key: ${{ matrix.build_type }}
        variant: sccache
        save: ${{ github.ref == 'refs/heads/main' }}

    # required for CMake to find Ninja
    - name: "Set up MSVC Developer Command Prompt"
      uses: compnerd/gha-setup-vsdevenv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Setup Python dependencies
      # the pipdeptree below is just for debugging but often comes handy so keep it enabled
      run: |
        python -m pip install -r tools/req_ci.txt -r docs/web/requirements.txt texttest pipdeptree
        python -m pip install -U --no-deps jupedsim
        pipdeptree

    - name: Building SUMO plain
      if: matrix.build_type == 'plain'
      run: |
        python -m pip install build wheel
        cmake -Bbuild_msvc -GNinja -DCHECK_OPTIONAL_LIBS=false -DENABLE_JAVA_BINDINGS=false
        cmake --build build_msvc

    - name: Building SUMO extra
      if: matrix.build_type == 'extra'
      run: |
        cmake -Bbuild_msvc -GNinja -DENABLE_JAVA_BINDINGS=false
        cmake --build build_msvc

    - name: Building SUMO debug
      if: github.event_name == 'workflow_dispatch'
      run: |
        cmake -Bbuild_msvc_debug -GNinja -DCMAKE_BUILD_TYPE=Debug
        cmake --build build_msvc_debug

    - name: Building TraaS
      run: cmake --build build_msvc --target traas

    - name: Building installers
      run: |
        cd build_msvc
        cpack -B D:/cpkg

    - name: Uploading artifacts (SUMO installers)
      uses: actions/upload-artifact@v7
      with:
        name: windows-${{ matrix.build_type }}-installers
        path: |
          D:/cpkg/sumo-*
          D:/cpkg/_CPack_Packages/win64/WIX/wix.log

    - name: Running examples and unit tests
      # the timeout is redundant to the settings in the CMakeLists but maybe submodules add tests too
      run: |
        cmake --build build_msvc --target examples
        ctest --test-dir build_msvc --output-on-failure --timeout 60

    - name: Running dependency checker
      if: matrix.build_type == 'extra'
      run: |
          Invoke-WebRequest -Uri https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release_.without.peview.exe.zip -OutFile Dependencies.zip
          7z x -oDependencies Dependencies.zip
          $env:PATH += ";$pwd\bin"
          dir tools\libsumo
          Dependencies\Dependencies.exe -modules -depth 2 tools\libsumo\_libsumo.pyd

    - name: Packaging build for test jobs
      shell: bash
      run: 7z a -bso0 -bsp0 -mx=1 D:/windows-${{ matrix.build_type }}-build.7z . -xr'!.git' -xr'!build_msvc' -xr'!build_msvc_debug' -xr'!SUMOLibraries*' -xr'!Dependencies'

    - name: Uploading build for test jobs
      uses: actions/upload-artifact@v7
      with:
        path: D:/windows-${{ matrix.build_type }}-build.7z
        archive: false

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the tests are split into shards because of resource constraints
        include:
          - {build_type: plain, shard: sumo, apps: "sumo"}
          - {build_type: plain, shard: routers-netbuild, apps: "activitygen,dfrouter,duarouter,jtrrouter,marouter,netgen,od2trips,polyconvert,netconvert"}
          - {build_type: extra, shard: complex, apps: "complex"}
          - {build_type: extra, shard: traci, apps: "traci"}
          - {build_type: extra, shard: tools, apps: "tools"}
          - {build_type: extra, shard: meso-extra-gdal, apps: "sumo.meso,sumo.extra,netconvert.gdal,polyconvert.gdal"}

    steps:
    - name: Downloading build
      uses: actions/download-artifact@v8
      with:
        name: windows-${{ matrix.build_type }}-build.7z
        skip-decompress: true

    - name: Unpacking build
      shell: bash
      run: 7z x -bso0 -bsp0 -y windows-${{ matrix.build_type }}-build.7z

    - name: Fetching SUMO Libraries
      # this also sets $SUMO_LIBRARIES
      uses: ./.github/actions/fetch-sumo-libraries

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Setup Python dependencies
      run: |
        python -m pip install -r tools/req_ci.txt texttest
        python -m pip install -U --no-deps jupedsim

    - name: Tests
      run: |
        $env:PATH += ";$pwd\bin"
        $env:TEXTTEST_CI_APPS = "-a ${{ matrix.apps }}"
        tests\runCiTests.bat texttest.exe

    - name: Compressing test results
      if: failure()
      shell: bash
      run: 7z a -bso0 -bsp0 texttesttmp-${{ matrix.build_type }}-${{ matrix.shard }}.zip ~/.texttest/tmp

    - name: Uploading test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        path: texttesttmp-${{ matrix.build_type }}-${{ matrix.shard }}.zip
        archive: false
        if-no-files-found: warn
