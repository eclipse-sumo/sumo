name: linux

on:
  push:            # run on push events
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
    branches:
      - '**'
    tags:
      - '*'
  pull_request:    # run on pull requests
    paths-ignore:  # but ignore everything in the docs subfolder
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron:  '5 0 * * *'

concurrency:
  # a push to a branch with a pull request is cancelled by the pull request run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # the nightly Sonar build takes up to 150 min, everything else less than 70 min
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 180 || 100 }}
    strategy:
      # Allow all other matrix-jobs to continue running, even if one of the jobs fails
      fail-fast: false
      # pull requests only build full+gcc and minimal+clang on x64
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request' &&
        '{"include": [
          {"os": "ubuntu-latest", "build_type": "full", "compiler": "gcc"},
          {"os": "ubuntu-latest", "build_type": "minimal", "compiler": "clang"}
        ]}' ||
        '{"os": ["ubuntu-latest", "ubuntu-24.04-arm"],
          "build_type": ["full", "minimal"],
          "compiler": ["gcc", "clang"]}') }}

    steps:
    - name: Cloning SUMO
      uses: actions/checkout@v7
      with:
        path: sumo
        fetch-depth: 0
        # filter: tree:0  # no tree filter because sonar needs to do a git blame
        # fetching the ref on tag runs to work around actions/checkout#1467
        ref: ${{ github.ref }}

    - name: Installing dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libunwind-dev  # to work around https://bugs.launchpad.net/ubuntu/+source/google-glog/+bug/1991919
        touch jupedsim.marker
        # the script also builds and installs jupedsim (to /usr/local)
        sudo sumo/build_config/install_dependencies.sh

    - name: ccache
      # the SonarQube build wrapper needs an uncached build
      if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.build_type == 'full' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.compiler == 'gcc') }}
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}
        save: ${{ github.ref == 'refs/heads/main' }}
        evict-old-files: job

    - name: Configuring SUMO
      run: |
        mkdir -p sumo/cmake-build
        cd sumo/cmake-build
        if [[ "${{ matrix.compiler }}" == "gcc" ]]; then export CC=gcc; export CXX=g++; fi
        if [[ "${{ matrix.compiler }}" == "clang" ]]; then export CC=clang; export CXX=clang++; fi
        if [[ "${{ matrix.build_type }}" == "full" ]]; then cmake ..; fi
        if [[ "${{ matrix.build_type }}" == "minimal" ]]; then cmake -DFOX_CONFIG= -DPROJ_LIBRARY= -DCHECK_OPTIONAL_LIBS=OFF -DFMI=OFF ..; fi

    - name: Building Traas
      run: |
        cd sumo/cmake-build
        make traas

    - name: Setting up SonarQube
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'full' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.compiler == 'gcc'
      uses: warchant/setup-sonar-scanner@v10
      # with:
        # version: 6.0.0.4432

    - name: Building SUMO with SonarQube wrapper
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'full' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.compiler == 'gcc'
      run: |
        cd sumo/cmake-build
        curl -L -O https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
        unzip -o build-wrapper-linux-x86.zip
        build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir bw-output make -j4
        cd ..
        export SONAR_SCANNER_JAVA_OPTS="-Xmx8192m"
        export SONAR_SCANNER_OPTS="-Xmx8192m"
        sonar-scanner -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.cfamily.compile-commands=cmake-build/bw-output/compile_commands.json

    - name: Building and Installing SUMO
      run: |
        cd sumo/cmake-build
        make -j4
        sudo make install

    - name: Building Examples and Unit Tests
      if: matrix.build_type == 'full'
      run: |
        cd sumo/cmake-build
        make CTEST_OUTPUT_ON_FAILURE=1 examples test

    - name: Packaging build for test jobs
      if: matrix.build_type == 'full'
      run: |
        # jupedsim was installed into /usr/local by the dependency script
        find /usr/local \( -type f -o -type l \) -newer jupedsim.marker > jupedsim-files.txt
        tar -cPf jupedsim.tar -T jupedsim-files.txt
        tar -I zstd -cf ${{ matrix.os }}-${{ matrix.compiler }}-build.tar.zst --exclude=sumo/.git --exclude=sumo/cmake-build sumo jupedsim.tar

    - name: Uploading build for test jobs
      if: matrix.build_type == 'full'
      uses: actions/upload-artifact@v7
      with:
        path: ${{ matrix.os }}-${{ matrix.compiler }}-build.tar.zst
        archive: false

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      # texttest applications are split into shards, the extra tests need the gcc build on x64
      # pull requests only test the x64 full+gcc build
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request' &&
        '{"os": ["ubuntu-latest"],
          "compiler": ["gcc"],
          "shard": ["complex", "tools-traci", "other"],
          "include": [{"os": "ubuntu-latest", "compiler": "gcc", "shard": "extra"}]}' ||
        '{"os": ["ubuntu-latest", "ubuntu-24.04-arm"],
          "compiler": ["gcc", "clang"],
          "shard": ["complex", "tools-traci", "other"],
          "include": [{"os": "ubuntu-latest", "compiler": "gcc", "shard": "extra"}]}') }}

    steps:
    - name: Downloading build
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.os }}-${{ matrix.compiler }}-build.tar.zst
        skip-decompress: true

    - name: Unpacking build
      run: |
        tar -I zstd -xf ${{ matrix.os }}-${{ matrix.compiler }}-build.tar.zst
        sudo tar -xPf jupedsim.tar
        sudo ldconfig

    - name: Installing dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libunwind-dev
        # jupedsim comes from the build artifact
        sudo SKIP_JUPEDSIM=1 sumo/build_config/install_dependencies.sh
        sudo apt-get install $(cat sumo/build_config/tools_req_deb.txt)
        python3 -m venv testenv --system-site-packages
        source testenv/bin/activate
        python3 -m pip install -r sumo/tools/req_ci.txt texttest pipdeptree
        python3 -m pip install -U --no-deps jupedsim

    - name: Tests
      run: |
        source testenv/bin/activate
        nproc; lscpu | grep -E 'Model name|MHz|Thread|Hypervisor'; uptime
        if [[ "${{ matrix.shard }}" == "extra" ]]; then
          sumo/tests/runTests.sh -b ci -a sumo.meso.ci,sumo.extra.ci
          sumo/tests/runTests.sh -b ci -a netconvert.gdal.ci,polyconvert.gdal.ci
          exit 0
        fi
        case "${{ matrix.shard }}" in
          complex) APPS=complex ;;
          tools-traci) APPS=tools,traci ;;
          other) APPS=sumo,netconvert,duarouter,dfrouter,jtrrouter,marouter,od2trips,netgen,polyconvert,activitygen,netedit,neteditoutput,sumo.gui,netedit.internal ;;
        esac
        if [[ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]]; then TEXTTEST_FILTER="-finverse $PWD/sumo/tests/filter_files/linux_arm_failures.txt"; fi
        sumo/tests/runTests.sh -b ci -v ci -a $APPS $TEXTTEST_FILTER

    - name: Compressing test results
      if: failure()
      run: 7z a -bso0 -bsp0 texttesttmp-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.shard }}.zip ~/.texttest/tmp

    - name: Uploading test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        path: texttesttmp-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.shard }}.zip
        archive: false
        if-no-files-found: warn
